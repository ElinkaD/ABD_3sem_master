services:
  postgres:
    image: postgres:16
    container_name: abd_lab1_postgres
    environment:
      POSTGRES_DB: craft_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./task1/init:/docker-entrypoint-initdb.d:ro
      - ./task1:/task1:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d craft_market" ]
      interval: 5s
      timeout: 5s
      retries: 10
