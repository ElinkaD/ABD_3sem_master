name: abd_lab2

x-vertica-client: &vertica-client
  VERTICA_HOST: vertica
  VERTICA_DB: dwh
  VERTICA_USER: dbadmin
  VERTICA_PASSWORD: ${VERTICA_PASSWORD:-12345}

services:
  vertica:
    image: opentext/vertica-k8s:23.4.0-0-minimal
    platform: linux/amd64
    restart: unless-stopped
    command: [/command/with-contenv, bash, /vertica/start.sh]
    stop_grace_period: 2m
    environment:
      <<: *vertica-client
      VERTICA_MEMDEBUG: 2
    ports:
      - "127.0.0.1:${VERTICA_PORT:-5433}:5433"
    volumes:
      - vertica_data:/home/dbadmin
      - vertica_config:/opt/vertica/config
      - ./docker/vertica/start.sh:/vertica/start.sh:ro
    healthcheck:
      test: [CMD-SHELL, '/opt/vertica/bin/vsql -U dbadmin -w "$$VERTICA_PASSWORD" -d dwh -Atc "SELECT 1"']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 3m

  vertica-bootstrap:
    image: opentext/vertica-k8s:23.4.0-0-minimal
    platform: linux/amd64
    depends_on:
      vertica:
        condition: service_healthy
    entrypoint: [bash, /bootstrap/bootstrap.sh]
    environment: *vertica-client
    volumes:
      - ./docker/vertica:/bootstrap:ro
      - ./data/schemas:/schemas:ro
      - ./data/seeds:/seeds:ro

  airflow:
    build: ./docker/airflow
    command: standalone
    depends_on:
      vertica-bootstrap:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Europe/Moscow
      AIRFLOW_CONN_VERTICA_DWH: '{"conn_type":"generic","host":"vertica","login":"dbadmin","password":"${VERTICA_PASSWORD:-12345}","schema":"dwh","port":5433}'
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8082}:8080"
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags:ro
      - ./models:/opt/airflow/models:ro
      - ./data/source:/data:ro

volumes:
  vertica_data:
  vertica_config:
  airflow_data:
